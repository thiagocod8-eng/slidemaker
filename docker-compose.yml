version: "3.8"
services:
  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: bash -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:4000

  backend:
    image: node:18
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./sd-models:/sd-models
      - ./backend/public:/app/public
    command: bash -c "npm install && node server.js"
    ports:
      - "4000:4000"
    environment:
      - SD_WEBUI_URL=http://sd-webui:7860
      - WHISPER_CMD=
    depends_on:
      - sd-webui

  sd-webui:
    image: ghcr.io/automatic1111/stable-diffusion-webui:latest
    runtime: nvidia
    environment:
      - CLI_ARGS=--listen --port 7860 --disable-safe-unpickle
    volumes:
      - ./sd-models:/stable-diffusion-webui/models
    ports:
      - "7860:7860"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
